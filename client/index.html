<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Collaboratif Isométrique</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="landing-container" id="landing">
    <div class="insuffle-branding">
      <img src="https://www.insuffle.com/wp-content/uploads/2025/04/cropped-logo-insuffle-v2-1.png" alt="Insuffle" class="insuffle-logo">
    </div>
    <h1>Espace Collaboratif</h1>
    <p class="landing-subtitle">Créez un espace isométrique pour vos réunions, ateliers et séminaires à distance. Jusqu'à 20 participants, audio par proximité.</p>
    <p class="powered-by">Propulsé par <strong>Insuffle</strong> — Facilitation &amp; Collaboration</p>

    <div class="form-group">
      <label for="room-name">Nom de la salle</label>
      <input type="text" id="room-name" placeholder="Ma réunion d'équipe" maxlength="50">
      <span class="error-message" id="error-name">Veuillez saisir un nom pour votre salle</span>
    </div>

    <div class="form-group">
      <label for="environment">Environnement</label>
      <select id="environment">
        <option value="bureau">Bureau</option>
        <option value="open-space" selected>Open Space</option>
        <option value="salle-de-conference">Salle de Conférence</option>
        <option value="coworking">Espace Coworking (zones numérotées)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="grid-size">Taille de la grille</label>
      <input type="range" id="grid-size" min="10" max="100" value="20" step="5">
      <div class="grid-size-display"><span id="grid-size-value">20</span> x <span id="grid-size-value2">20</span></div>
    </div>

    <button class="btn btn-primary" id="btn-create">Créer la salle</button>
    <span class="error-message" id="error-create" style="text-align:center;"></span>

    <div style="margin-top: 24px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 24px; width: 320px; text-align: center;">
      <p style="color: rgba(255,255,255,0.6); font-size: 0.85rem; margin-bottom: 12px;">Ou rejoindre une salle existante</p>
      <div class="form-group">
        <input type="text" id="room-id-input" placeholder="Identifiant de la salle" aria-label="Identifiant de la salle a rejoindre">
      </div>
      <button class="btn btn-secondary" id="btn-join" style="margin-top: 8px;">Rejoindre</button>
    </div>
  </div>

  <script src="../shared/constants.js"></script>
  <script>
    const gridSizeInput = document.getElementById('grid-size');
    const gridSizeValue = document.getElementById('grid-size-value');
    const gridSizeValue2 = document.getElementById('grid-size-value2');

    gridSizeInput.addEventListener('input', () => {
      gridSizeValue.textContent = gridSizeInput.value;
      gridSizeValue2.textContent = gridSizeInput.value;
    });

    const createBtn = document.getElementById('btn-create');
    const joinBtn = document.getElementById('btn-join');

    createBtn.addEventListener('click', async () => {
      const name = document.getElementById('room-name').value.trim();
      const errorEl = document.getElementById('error-name');
      const errorCreate = document.getElementById('error-create');

      if (!name) {
        errorEl.style.display = 'block';
        document.getElementById('room-name').focus();
        return;
      }
      errorEl.style.display = 'none';
      errorCreate.style.display = 'none';

      // Show loading state
      createBtn.classList.add('btn-loading');
      createBtn.disabled = true;

      const env = document.getElementById('environment').value;
      const size = parseInt(gridSizeInput.value);

      try {
        const resp = await fetch('/api/rooms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, environment: env, gridSize: size }),
        });

        const data = await resp.json();

        if (!resp.ok) {
          errorCreate.textContent = data.error || 'Impossible de créer la salle. Veuillez réessayer.';
          errorCreate.style.display = 'block';
          createBtn.classList.remove('btn-loading');
          createBtn.disabled = false;
          return;
        }

        // Redirect to room with creator flag
        const params = new URLSearchParams({
          room: data.roomId,
          name: name,
          env: env,
          size: size,
          creator: 'true',
        });
        window.location.href = `room.html?${params.toString()}`;
      } catch (err) {
        errorCreate.textContent = 'Le serveur est injoignable. Vérifiez votre connexion et réessayez.';
        errorCreate.style.display = 'block';
        createBtn.classList.remove('btn-loading');
        createBtn.disabled = false;
      }
    });

    // Allow Enter key on room name to create
    document.getElementById('room-name').addEventListener('keydown', (e) => {
      if (e.code === 'Enter') createBtn.click();
    });

    joinBtn.addEventListener('click', () => {
      const roomId = document.getElementById('room-id-input').value.trim();
      if (roomId) {
        joinBtn.classList.add('btn-loading');
        joinBtn.disabled = true;
        window.location.href = `room.html?room=${roomId}`;
      }
    });

    // Allow Enter key on room ID to join
    document.getElementById('room-id-input').addEventListener('keydown', (e) => {
      if (e.code === 'Enter') joinBtn.click();
    });
  </script>
</body>
</html>
